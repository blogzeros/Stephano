<style>
  :root{
    --bg:#f3f3f5; --card:#ffffff;
    --grey-100:#e8e8e8; --grey-200:#dcdcdc;
    --text-primary:#3a3a3a; --text-secondary:#999;
    --primary:#bd32af; --primary-tint:rgba(189,50,175,0.08);
    --font-heading:"Urbanist","Mulish",ui-sans-serif,sans-serif;
    --font-body:"Mulish",ui-sans-serif,sans-serif;
  }
  html.dark{
    --bg:hsl(226,4%,14%); --card:hsl(226,4%,17%);
    --grey-100:hsl(226,4%,24%); --grey-200:hsl(226,4%,30%);
    --text-primary:hsl(0,0%,92%); --text-secondary:hsl(0,0%,55%);
    --primary-tint:rgba(189,50,175,0.12);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; padding:24px; overflow:hidden;
    position:relative;
  }

  /* Decorative corner blobs */
  body::before, body::after{
    content:""; position:absolute; border-radius:50%; pointer-events:none;
  }
  body::before{
    width:500px; height:500px; top:-180px; right:-120px;
    background:radial-gradient(circle, rgba(200,200,210,0.25), transparent 70%);
  }
  body::after{
    width:600px; height:600px; bottom:-200px; left:-150px;
    background:radial-gradient(circle, rgba(200,200,210,0.2), transparent 70%);
  }

  .card{
    position:relative; background:var(--card); border-radius:24px;
    box-shadow:0 8px 40px rgba(0,0,0,0.06);
    width:100%; max-width:780px; min-height:420px;
    display:flex; align-items:center; justify-content:center;
    padding:56px 40px; z-index:1;
  }

  .center{text-align:center;}

  .logo{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:40px;}
  .logo-mark{width:28px; height:28px;}
  .logo-text{font-family:var(--font-heading); font-weight:800; font-size:20px; color:var(--text-primary); letter-spacing:-0.01em;}

  .error-title{
    font-family:var(--font-heading); font-weight:800; font-size:28px;
    color:var(--text-primary); margin-bottom:8px; letter-spacing:-0.01em;
  }

  .error-code{
    font-size:15px; color:var(--text-secondary); margin-bottom:32px;
  }

  .home-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 32px; border-radius:999px;
    border:1.5px solid var(--grey-200); background:transparent;
    font-family:var(--font-heading); font-weight:700; font-size:15px;
    color:var(--text-primary); cursor:pointer; text-decoration:none;
    transition:border-color .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .home-btn:hover{border-color:var(--primary); color:var(--primary);}
  .home-btn svg{width:18px; height:18px;}

  @media (max-width:860px){
    .card{padding:44px 28px; min-height:360px;}
  }
  @media (max-width:520px){
    .card{padding:36px 20px; min-height:320px; border-radius:20px;}
    .error-title{font-size:23px;}
    .logo-text{font-size:17px;}
  }
</style>
