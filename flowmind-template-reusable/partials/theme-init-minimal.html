<script>
(function(){
  var THEME_COLORS = {
    purple: ['#bd32af','#9b2a90','rgba(189,50,175,0.10)'],
    blue:   ['#00c0eb','#0092b3','rgba(0,192,235,0.10)'],
    green:  ['#67bb3a','#4f9a2c','rgba(103,187,58,0.10)'],
    orange: ['#f8a32a','#d1840f','rgba(248,163,42,0.12)']
  };
  var mode = localStorage.getItem('flowmind_theme_mode') || 'light';
  var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (isDark) document.documentElement.classList.add('dark');
  var colorName = localStorage.getItem('flowmind_theme_color') || 'purple';
  var c = THEME_COLORS[colorName] || THEME_COLORS.purple;
  var root = document.documentElement.style;
  root.setProperty('--primary', c[0]);
  root.setProperty('--primary-dark', c[1]);
  root.setProperty('--primary-tint', c[2]);
  root.setProperty('--grad-brand', c[0]);
})();
</script>
